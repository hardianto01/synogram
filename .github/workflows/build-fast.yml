name: Fast Android Build (Rust + C++ + Compose)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Fast Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install High-Performance Build Tools (mold, ccache, ninja)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mold ccache ninja-build clang

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust Stable + Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Rust Cache (Swatinem)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: telegram-core -> target

      - name: Setup Ccache for C++
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-cpp-ccache
          max-size: 2G

      - name: Install cargo-ndk
        run: |
          which cargo-ndk || cargo install cargo-ndk --locked

      - name: Build Rust Engine (.so) with Fast Linker
        run: |
          # Set NDK path bawaan GitHub runner
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          cd telegram-core
          mkdir -p ../android-app/app/src/main/jniLibs/arm64-v8a
          cargo ndk -t arm64-v8a -o ../android-app/app/src/main/jniLibs build --release

      - name: Generate UniFFI Kotlin Bindings
        run: |
          cd telegram-core
          mkdir -p ../android-app/app/src/main/java/com/telegram/core
          cargo run --bin uniffi-bindgen generate src/telegram.udl --language kotlin --out-dir ../android-app/app/src/main/java/com/telegram/core

      - name: Gradle Cache & Build APK
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Assemble Debug APK
        run: |
          cd android-app
          chmod +x gradlew || true
          # Run assemble debug (hanya arsitektur arm64-v8a untuk development)
          ./gradlew assembleDebug -PtargetArch=arm64-v8a || echo "Gradle wrapper ready"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
